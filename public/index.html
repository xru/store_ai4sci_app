<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai4sci.app — AI for Science App Store</title>
  <meta name="description" content="Discover, explore, and access AI-powered science prototype applications. Browse tech prototypes for bioinformatics, chemistry, physics, climate, and more.">
  <style>
    :root {
      --bg: #0a0e1a; --card: #141b2d; --border: #1e293b;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; --accent2: #8b5cf6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    a { color: inherit; text-decoration: none; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 100; }
    .logo { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 24px; align-items: center; }
    .nav-links a { color: var(--muted); font-size: 14px; }
    .nav-links a:hover { color: var(--text); }
    .btn-login { padding: 8px 16px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 14px; }

    main { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    .hero { text-align: center; padding: 60px 0 40px; }
    .hero h1 { font-size: 48px; font-weight: 800; margin-bottom: 16px; }
    .hero p { font-size: 18px; color: var(--muted); max-width: 600px; margin: 0 auto; }

    .search { display: flex; justify-content: center; margin: 32px 0; }
    .search input { width: 100%; max-width: 500px; padding: 14px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; }

    .categories { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 32px 0; }
    .cat-pill { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--card); font-size: 14px; cursor: pointer; }
    .cat-pill:hover, .cat-pill.active { border-color: var(--accent); background: rgba(99,102,241,0.15); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .card-cover { height: 160px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .card-body { padding: 20px; }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .card-subtitle { font-size: 13px; color: var(--accent2); margin-bottom: 12px; }
    .card-summary { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .tier-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-top: 12px; }
    .tier-free { background: rgba(34,197,94,0.15); color: #4ade80; }
    .tier-login { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .tier-paid { background: rgba(99,102,241,0.15); color: var(--accent); }

    footer { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 60px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">ai4sci.app</a>
    <div class="nav-links">
      <a href="/apps">Browse</a>
      <a href="/categories">Categories</a>
      <a href="/pricing">Pricing</a>
      <a href="/api/auth/login" class="btn-login">Sign in with Google</a>
    </div>
  </nav>

  <main>
    <div class="hero">
      <h1>AI for Science App Store</h1>
      <p>Discover, explore, and access AI-powered science prototype applications — from protein folding to climate modeling.</p>
    </div>

    <div class="search">
      <input type="text" id="search" placeholder="Search science AI apps...">
    </div>

    <div class="categories" id="categories"></div>

    <div class="grid" id="app-grid">
      <div class="loading">Loading apps...</div>
    </div>
  </main>

  <footer>
    ai4sci.app — Built on Cloudflare · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
  </footer>

  <script>
    const API = '/api';
    let activeCategory = null;

    async function loadCategories() {
      const res = await fetch(`${API}/categories`);
      const data = await res.json();
      const el = document.getElementById('categories');
      const all = document.createElement('div');
      all.className = 'cat-pill active';
      all.textContent = 'All';
      all.onclick = () => { activeCategory = null; document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active')); all.classList.add('active'); loadApps(); };
      el.appendChild(all);
      data.categories.forEach(c => {
        const pill = document.createElement('div');
        pill.className = 'cat-pill';
        pill.textContent = `${c.icon || ''} ${c.name}`;
        pill.onclick = () => { activeCategory = c.id; document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); loadApps(); };
        el.appendChild(pill);
      });
    }

    async function loadApps() {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = '<div class="loading">Loading...</div>';
      const params = new URLSearchParams();
      if (activeCategory) params.set('category', activeCategory);
      const q = document.getElementById('search').value;
      if (q) params.set('q', q);
      const res = await fetch(`${API}/apps?${params}`);
      const data = await res.json();
      if (!data.apps?.length) { grid.innerHTML = '<div class="loading">No apps found.</div>'; return; }
      grid.innerHTML = '';
      data.apps.forEach(app => {
        const card = document.createElement('a');
        card.href = `/apps/${app.slug}`;
        card.className = 'card';
        const badges = [];
        if (app.deep_info) badges.push('<span class="tier-badge tier-paid">🔒 Deep Info</span>');
        if (app.description) badges.push('<span class="tier-badge tier-login">👁️ Details</span>');
        else badges.push('<span class="tier-badge tier-free">Free Preview</span>');
        card.innerHTML = `
          <div class="card-cover">🧪</div>
          <div class="card-body">
            <div class="card-title">${app.title}</div>
            <div class="card-subtitle">${app.subtitle || ''}</div>
            <div class="card-summary">${app.summary}</div>
            <div>${badges.join(' ')}</div>
          </div>`;
        grid.appendChild(card);
      });
    }

    document.getElementById('search').addEventListener('input', () => clearTimeout(window._t), );
    document.getElementById('search').addEventListener('input', () => {
      clearTimeout(window._t); window._t = setTimeout(loadApps, 300);
    });

    loadCategories();
    loadApps();
  </script>
</body>
</html>
