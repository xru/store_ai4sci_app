<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ai4sci.app — AI for Science App Store</title>
  <meta name="description" content="Discover, explore, and access AI-powered science prototype applications.">
  <style>
    :root{--bg:#0a0e1a;--card:#141b2d;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--accent2:#8b5cf6}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
    a{color:inherit;text-decoration:none}
    nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100}
    .logo{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .nav-links{display:flex;gap:20px;align-items:center}
    .nav-links a{color:var(--muted);font-size:14px}.nav-links a:hover{color:var(--text)}
    .btn-login{padding:8px 16px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px}
    .lang-btn{padding:5px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;cursor:pointer;line-height:1;transition:border-color .15s,background .15s}
    .lang-btn:hover{border-color:var(--accent);background:rgba(99,102,241,.1)}
    main{max-width:1200px;margin:0 auto;padding:40px 24px}
    .hero{text-align:center;padding:48px 0 32px}
    .hero h1{font-size:44px;font-weight:800;margin-bottom:16px}
    .hero p{font-size:17px;color:var(--muted);max-width:600px;margin:0 auto}
    .search{display:flex;justify-content:center;margin:28px 0}
    .search input{width:100%;max-width:500px;padding:13px 20px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px}
    .cat-section{margin:24px 0;padding:16px 20px;border:1px solid var(--border);border-radius:14px;background:var(--card)}
    .cat-section-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:12px}
    .cat-pills{display:flex;flex-wrap:wrap;gap:10px}
    .cat-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:20px;border:1px solid var(--border);background:var(--bg);font-size:14px;cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
    .cat-pill:hover{border-color:var(--accent)}
    .cat-pill.active{border-color:var(--accent);background:rgba(99,102,241,.18)}
    .cat-count{font-size:11px;color:var(--muted);background:rgba(148,163,184,.15);border-radius:8px;padding:1px 7px}
    .clear-bar{text-align:center;margin:8px 0 24px}
    .clear-bar button{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 16px;color:var(--muted);font-size:13px;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:28px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .2s,border-color .2s}
    .card:hover{transform:translateY(-4px);border-color:var(--accent)}
    .card-cover{height:140px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:44px}
    .card-body{padding:18px}
    .card-title{font-size:17px;font-weight:700;margin-bottom:4px}
    .card-subtitle{font-size:13px;color:var(--accent2);margin-bottom:10px}
    .card-summary{font-size:13px;color:var(--muted);line-height:1.5}
    .tier-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;margin-top:10px}
    .tier-free{background:rgba(34,197,94,.15);color:#4ade80}
    .tier-login{background:rgba(251,191,36,.15);color:#fbbf24}
    .tier-paid{background:rgba(99,102,241,.15);color:var(--accent)}
    footer{text-align:center;padding:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:60px}
    .loading{text-align:center;padding:40px;color:var(--muted)}
  </style>
  <link rel="canonical" href="https://ai4sci.app/">
  <meta property="og:title" content="ai4sci.app — AI for Science App Store">
  <meta property="og:description" content="Discover, explore, and access AI-powered science prototype applications.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ai4sci.app/">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"ai4sci.app","url":"https://ai4sci.app/","potentialAction":{"@type":"SearchAction","target":"https://ai4sci.app/apps?q={search_term_string}","query-input":"required name=search_term_string"}}
  </script>
</head>
<body>
  <nav>
    <a href="/" class="logo">ai4sci.app</a>
    <div class="nav-links">
      <a href="/apps" data-i18n="nav.browse">Browse</a>
      <a href="/pricing" data-i18n="nav.pricing">Pricing</a>
      <a href="/submit" data-i18n="nav.submit">Submit</a>
      <a href="https://dash.ai4sci.app/" id="nav-admin" style="display:none">Admin</a>
      <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">中文</button>
      <a href="/api/auth/login" class="btn-login" data-i18n="nav.signin">Sign in</a>
    </div>
  </nav>
  <main>
    <div class="hero">
      <h1>AI for Science App Store</h1>
      <p id="hero-sub" data-i18n="hero.subtitle">Beginners &middot; Professionals &middot; Researchers &mdash; find the right AI tools &amp; prototypes for your role.</p>
    </div>
    <div class="search"><input type="text" id="search" placeholder="Search AI tools…" data-i18n-ph="search.ph"></div>
    <div id="categories"></div>
    <div class="clear-bar" id="clear-bar" style="display:none"><button onclick="clearFilters()" data-i18n="clear">Clear filters</button></div>
    <div class="grid" id="app-grid"><div class="loading" data-i18n="loading">Loading…</div></div>
  </main>
  <footer>ai4sci.app — Built on Cloudflare</footer>
  <script>
    // ── i18n ──────────────────────────────────────────────
    let LANG = localStorage.getItem('ai4sci_lang') || 'en';

    const I18N = {
      en: {
        'nav.browse': 'Browse', 'nav.pricing': 'Pricing', 'nav.submit': 'Submit',
        'nav.signin': 'Sign in', 'nav.admin': 'Admin',
        'hero.subtitle': 'Beginners \u00b7 Professionals \u00b7 Researchers — find the right AI tools & prototypes for your role.',
        'search.ph': 'Search AI tools…',
        'clear': 'Clear filters',
        'empty': 'No results.',
        'loading': 'Loading…',
      },
      zh: {
        'nav.browse': '浏览', 'nav.pricing': '定价', 'nav.submit': '提交',
        'nav.signin': '登录', 'nav.admin': '管理',
        'hero.subtitle': '研究生 · 打工人 · 小白 —— 按你的角色找到最趁手的 AI 工具与原型。',
        'search.ph': '搜索 AI 工具…',
        'clear': '清除筛选',
        'empty': '暂无结果。',
        'loading': 'Loading…',
      }
    };

    // slug → English display name (DB stores Chinese names; EN mode maps via slug)
    const CAT_EN = {
      'beginners': 'Beginners', 'professionals': 'Professionals', 'grad-students': 'Researchers',
      'web-deployment': 'Web Deployment', 'nlp': 'NLP', 'reinforcement-learning': 'Reinforcement Learning',
    };

    function t(k){ return (I18N[LANG]||I18N.en)[k] || k; }
    function catName(c){ return CAT_EN[c.slug] || c.name; }

    // Chinese overlay for app body fields (English is the DB source of truth).
    const APP_ZH = {};
        function appField(app, field){
      if (LANG==='zh' && APP_ZH[app.slug] && APP_ZH[app.slug][field] != null) return APP_ZH[app.slug][field];
      return app[field] != null ? app[field] : '';
    }

    function applyLang(){
      document.documentElement.lang = LANG==='en' ? 'en' : 'zh-CN';
      // static text
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
      // toggle button label: show the *other* language
      document.getElementById('lang-toggle').textContent = LANG==='en' ? '中文' : 'EN';
      // re-render dynamic content (categories + apps) with new language
      renderCategories();
      loadApps();
    }

    function toggleLang(){
      LANG = LANG==='en' ? 'zh' : 'en';
      localStorage.setItem('ai4sci_lang', LANG);
      applyLang();
    }

    // ── Data / categories ─────────────────────────────────
    const API='/api';
    let activeCats=[];
    let parents=[], children={}, catBySlug={};

    async function loadCategories(){
      const res=await fetch(`${API}/categories`);const data=await res.json();
      const all=data.categories||[];
      parents=all.filter(c=>!c.parent_id).sort((a,b)=>a.sort_order-b.sort_order);
      children={};all.forEach(c=>{
        catBySlug[c.slug]=c;
        if(c.parent_id){(children[c.parent_id]=children[c.parent_id]||[]).push(c)}
      });
      Object.values(children).forEach(arr=>arr.sort((a,b)=>a.sort_order-b.sort_order));
      renderCategories();
    }

    function renderCategories(){
      const box=document.getElementById('categories');box.innerHTML='';
      parents.forEach(p=>{
        const kids=children[p.id]||[];
        const sec=document.createElement('div');sec.className='cat-section';
        const head=document.createElement('div');head.className='cat-section-head';
        head.innerHTML=`<span>${p.icon||''}</span><span>${catName(p)}</span><span style="color:var(--muted);font-weight:400;font-size:13px">(${kids.length})</span>`;
        sec.appendChild(head);
        const pills=document.createElement('div');pills.className='cat-pills';
        kids.forEach(k=>{
          const pill=document.createElement('div');pill.className='cat-pill';pill.dataset.slug=k.slug;
          const cnt=k.app_count!=null?`<span class="cat-count">${k.app_count}</span>`:'';
          pill.innerHTML=`<span>${k.icon||''} ${catName(k)}</span>${cnt}`;
          pill.onclick=()=>toggleCat(k.slug);
          pills.appendChild(pill);
        });
        sec.appendChild(pills);box.appendChild(sec);
      });
      syncPills();
    }

    function toggleCat(slug){
      const i=activeCats.indexOf(slug);
      if(i===-1)activeCats.push(slug);else activeCats.splice(i,1);
      syncPills();loadApps();
    }
    function syncPills(){
      document.querySelectorAll('.cat-pill[data-slug]').forEach(p=>p.classList.toggle('active',activeCats.includes(p.dataset.slug)));
      document.getElementById('clear-bar').style.display=activeCats.length?'block':'none';
    }
    function clearFilters(){activeCats=[];syncPills();loadApps();}

    async function loadApps(){
      const grid=document.getElementById('app-grid');grid.innerHTML=`<div class="loading">${t('loading')}</div>`;
      const params=new URLSearchParams();
      if(activeCats.length)params.set('category',activeCats.join(','));
      const q=document.getElementById('search').value;if(q)params.set('q',q);
      const res=await fetch(`${API}/apps?${params}`);const data=await res.json();
      if(!data.apps?.length){grid.innerHTML=`<div class="loading">${t('empty')}</div>`;return}
      grid.innerHTML='';
      data.apps.forEach(app=>{
        const card=document.createElement('a');card.href=`/apps/${app.slug}`;card.className='card';
        const badges=[];
        if(app.deep_info)badges.push('<span class="tier-badge tier-paid">🔒 Deep</span>');
        if(app.description)badges.push('<span class="tier-badge tier-login">👁 Details</span>');
        else badges.push('<span class="tier-badge tier-free">Free</span>');
        const cover = app.cover_r2_key
          ? `<div class="card-cover" style="padding:0;height:160px"><img src="/api/apps/${app.slug}/cover" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>`
          : `<div class="card-cover">🧪</div>`;
        card.innerHTML=`${cover}<div class="card-body"><div class="card-title">${app.title}</div><div class="card-subtitle">${appField(app,'subtitle')}</div><div class="card-summary">${appField(app,'summary')}</div><div>${badges.join(' ')}</div></div>`;
        grid.appendChild(card);
      });
    }

    // ── Init ──────────────────────────────────────────────
    document.getElementById('search').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(loadApps,300)});

    // admin link visibility
    fetch(`${API}/me`).then(r=>r.json()).then(d=>{
      if(d.user && d.user.role==='admin'){
        const a=document.getElementById('nav-admin');
        if(a){a.style.display='inline';a.textContent=t('nav.admin');}
      }
    }).catch(()=>{});

    loadCategories();
    applyLang();   // applies default (en) + renders
    loadApps();
  </script>
</body>
</html>
